# Opcional: publica en el host los puertos de cada servicio, para depurar o usar
# Scalar/Swagger directamente. Se combina con el compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d

services:
  frontend:
    ports: ["3000:3000"]
  reportes:
    ports: ["5039:8080"]        # Scalar: http://localhost:5039/scalar/v1
  auditoria:
    ports: ["5040:8080"]        # Scalar: http://localhost:5040/scalar/v1 (las APIs piden la clave del gateway)
  geoespacial-api:
    ports: ["8000:8000"]        # Swagger: http://localhost:8000/docs
  usuarios:
    ports: ["8081:8080"]        # Swagger: http://localhost:8081/swagger-ui.html
  rabbitmq:
    ports: ["5672:5672", "15672:15672"]
  postgres-reportes:
    ports: ["5432:5432"]
  geoespacial-db:
    ports: ["5433:5432"]
  postgres-usuarios:
    ports: ["5434:5432"]
