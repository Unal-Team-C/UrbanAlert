# Entorno local completo de UrbanAlert.
#   cd infrastructure && docker compose up -d --build
# Credenciales por defecto solo para desarrollo; se cambian con un .env (ver .env.example).

name: urbanalert

services:
  # ---------------------------------------------------------------- Mensajería
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-urbanalert}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-urbanalert}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------- Reportes + Auditoria
  # Un PostgreSQL con dos bases: urbanalert_reportes y urbanalert_auditoria.
  postgres-reportes:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urbanalert_reportes
      POSTGRES_USER: ${REPORTES_DB_USER:-urbanalert}
      POSTGRES_PASSWORD: ${REPORTES_DB_PASSWORD:-urbanalert}
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:-audit_writer}
      AUDIT_READER_PASSWORD: ${AUDIT_READER_PASSWORD:-audit_reader}
      REPORTES_READER_PASSWORD: ${REPORTES_READER_PASSWORD:-reportes_reader}
    ports:
      - "5432:5432"
    volumes:
      - postgres-reportes-data:/var/lib/postgresql/data
      - ./postgres-reportes/01-auditoria.sh:/docker-entrypoint-initdb.d/01-auditoria.sh:ro
      - ../backend/UrbanAlert.Auditoria/database:/auditoria-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  reportes:
    build:
      context: ../backend/UrbanAlert.Reportes
      dockerfile: deploy/docker/Dockerfile
    environment:
      # Development: aplica las migraciones al arrancar y publica Scalar en /scalar/v1.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres-reportes;Port=5432;Database=urbanalert_reportes;Username=${REPORTES_DB_USER:-urbanalert};Password=${REPORTES_DB_PASSWORD:-urbanalert}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-urbanalert}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-urbanalert}
      Geoespacial__BaseUrl: http://geoespacial-api:8000
    ports:
      - "5039:8080"
    depends_on:
      postgres-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      geoespacial-api:
        condition: service_healthy

  auditoria:
    build:
      context: ../backend
      dockerfile: UrbanAlert.Auditoria/Dockerfile
    environment:
      # Development: no exige Cognito ni el secreto del API Gateway para arrancar.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuditWriter: Host=postgres-reportes;Port=5432;Database=urbanalert_auditoria;Username=audit_writer;Password=${AUDIT_WRITER_PASSWORD:-audit_writer}
      ConnectionStrings__AuditReader: Host=postgres-reportes;Port=5432;Database=urbanalert_auditoria;Username=audit_reader;Password=${AUDIT_READER_PASSWORD:-audit_reader}
      ConnectionStrings__CorePostgres: Host=postgres-reportes;Port=5432;Database=urbanalert_reportes;Username=reportes_reader;Password=${REPORTES_READER_PASSWORD:-reportes_reader}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-urbanalert}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-urbanalert}
    ports:
      - "5040:8080"
    depends_on:
      postgres-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------- Geoespacial
  geoespacial-db:
    build:
      context: ../backend/UrbanAlert.Geoespacial/db
    environment:
      POSTGRES_USER: ${GEOESPACIAL_DB_USER:-geospatial}
      POSTGRES_PASSWORD: ${GEOESPACIAL_DB_PASSWORD:-geospatial}
      POSTGRES_DB: geospatial
    ports:
      - "5433:5432"
    volumes:
      - geoespacial-db-data:/var/lib/postgresql/data
      - ../backend/UrbanAlert.Geoespacial/db:/geospatial-db:ro
      - ../backend/UrbanAlert.Geoespacial/db/init/01_init.sh:/docker-entrypoint-initdb.d/20_geospatial.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  geoespacial-api:
    build:
      context: ../backend/UrbanAlert.Geoespacial
      target: runtime
    environment:
      DATABASE_URL: postgresql://${GEOESPACIAL_DB_USER:-geospatial}:${GEOESPACIAL_DB_PASSWORD:-geospatial}@geoespacial-db:5432/geospatial
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      geoespacial-db:
        condition: service_healthy

  # ---------------------------------------------------------------- Usuarios
  postgres-usuarios:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urbanalert_users
      POSTGRES_USER: ${USUARIOS_DB_USER:-urbanalert}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD:-urbanalert}
    ports:
      - "5434:5432"
    volumes:
      - postgres-usuarios-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  usuarios:
    build:
      context: ../backend/UrbanAlert.Usuarios
      dockerfile: deploy/docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres-usuarios:5432/urbanalert_users
      DB_USERNAME: ${USUARIOS_DB_USER:-urbanalert}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:-urbanalert}
    ports:
      - "8081:8080"
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  # ---------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ../frontend/reportes-front
      args:
        # El proxy /api/reportes de Next.js se fija en el build: apunta al servicio interno.
        REPORTES_API_URL: http://reportes:8080
    ports:
      - "3000:3000"
    depends_on:
      - reportes

volumes:
  rabbitmq-data:
  postgres-reportes-data:
  geoespacial-db-data:
  postgres-usuarios-data:
